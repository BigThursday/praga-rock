<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prague Rock</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" id="meta-desc" content="Every rock, metal and punk gig in Prague, updated every 3 hours.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600&family=Big+Shoulders+Display:wght@800;900&display=swap">
<style>
/* La lista date sul retro di una maglietta da tour: mesi enormi, poi data, band, locale, una riga per sera. */
:root {
  --paper: #0e0f10;
  --panel: #1a1c1e;
  --ink: #f2f2ed;
  --soft: #a0a3a4;
  --line: #303337;
  --spot: #f0261c;
  --spot-ink: #0e0f10;
  --mark: #ffd400;
  --mark-ink: #0e0f10;
  --rock: #ff4a3d;
  --metal: #b4c2cf;
  --punk: #f0c419;
  --alt: #45c4b0;
  --hard: #ff9a3c;
  --stoner: #b48cff;
  --prog: #5aa9ff;
  --garage: #8fd14f;
  --bad: #ff6b60;
  --display: "Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
  --body: "Barlow", "Segoe UI", Arial, sans-serif;
  --tight: "Barlow Condensed", "Arial Narrow", Arial, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--paper); color: var(--ink); margin: 0;
  font: 400 16px/1.35 var(--body);
  font-variant-numeric: tabular-nums;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--paper); }
a { color: inherit; }
.wrap {
  max-width: 1040px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

header.top { padding-block: 28px 18px; }
/* Le tre lingue stanno in alto a destra: si vedono, non rubano la scena al titolo. */
.crown { display: flex; justify-content: flex-end; }
.langs { display: flex; border: 1px solid var(--line); }
.lang {
  font: 600 14px/1 var(--tight); letter-spacing: .1em; text-transform: uppercase;
  height: 30px; padding: 0 11px; cursor: pointer; border: 0; border-radius: 0;
  background: transparent; color: var(--soft);
}
.lang + .lang { border-left: 1px solid var(--line); }
.lang[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.lang:focus-visible { outline: 2px solid var(--spot); outline-offset: 2px; }

h1 {
  font: 900 clamp(64px, 17vw, 168px)/.82 var(--display);
  letter-spacing: -.01em; text-transform: uppercase; margin: 6px 0 0;
}
h1 span { color: var(--spot); }
@media (min-width: 640px) { h1 br { display: none; } h1 { font-size: clamp(96px, 13vw, 150px); } }
.lede { margin: 14px 0 0; max-width: 60ch; font-size: 18px; color: var(--soft); }
.lede b { color: var(--ink); font-weight: 600; }

.next {
  display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline;
  margin-top: 16px; padding: 10px 12px; background: var(--ink); color: var(--paper); text-decoration: none;
}
.next:hover { background: var(--spot); color: var(--spot-ink); }
.next small { font: 600 13px/1 var(--tight); letter-spacing: .08em; text-transform: uppercase; }
.next strong { font: 800 24px/1.05 var(--display); text-transform: uppercase; letter-spacing: .01em; min-width: 0; overflow-wrap: anywhere; }
.next em { font-style: normal; font-size: 15px; }

.bar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--paper); border-block: 2px solid var(--ink);
}
.bar .wrap { display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: center; padding-block: 10px; }
.search, .venue {
  font: 500 16px/1 var(--body); color: var(--ink); background: var(--panel);
  border: 1px solid var(--line); border-radius: 0; height: 40px; padding: 0 10px; min-width: 0;
}
.search { flex: 1 1 200px; }
.venue { flex: 0 1 190px; }
.search:focus-visible, .venue:focus-visible, .chip:focus-visible, a:focus-visible { outline: 2px solid var(--spot); outline-offset: 2px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  --c: var(--ink);
  font: 600 16px/1 var(--tight); letter-spacing: .03em; text-transform: uppercase;
  height: 40px; padding: 0 12px; cursor: pointer; border-radius: 0;
  background: transparent; color: var(--soft); border: 1px solid var(--line);
}
.chip[aria-pressed="true"] { background: var(--c); border-color: var(--c); color: var(--paper); }
.chip[data-g="rock"] { --c: var(--rock); }
.chip[data-g="metal"] { --c: var(--metal); }
.chip[data-g="punk"] { --c: var(--punk); }
.chip[data-g="alt"] { --c: var(--alt); }
.chip[data-g="hard"] { --c: var(--hard); }
.chip[data-g="stoner"] { --c: var(--stoner); }
.chip[data-g="prog"] { --c: var(--prog); }
.chip[data-g="garage"] { --c: var(--garage); }
.sizes { display: flex; flex: 1 0 100%; border: 2px solid var(--ink); }
.size {
  flex: 1 1 0; height: 46px; cursor: pointer; border: 0; border-radius: 0;
  font: 900 24px/1 var(--display); text-transform: uppercase; letter-spacing: .02em;
  background: transparent; color: var(--soft);
}
.size + .size { border-left: 2px solid var(--ink); }
.size[aria-pressed="true"] { background: var(--spot); color: var(--spot-ink); }
.size small { font: 600 14px/1 var(--tight); letter-spacing: .04em; margin-left: 6px; }
.size:focus-visible { outline: 2px solid var(--spot); outline-offset: 2px; }
.chip.newonly[aria-pressed="true"] { background: var(--mark); border-color: var(--mark); color: var(--mark-ink); }
.count { flex: 1 0 100%; margin: 0; font-size: 14px; color: var(--soft); }

main { padding-block: 8px 40px; }
.month { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 34px 0 4px; }
.month h2 { font: 900 clamp(40px, 9vw, 76px)/.95 var(--display); text-transform: uppercase; margin: 0; letter-spacing: 0; text-wrap: balance; }
.month span { font: 600 15px/1 var(--tight); letter-spacing: .06em; text-transform: uppercase; color: var(--soft); white-space: nowrap; }

ol.gigs { list-style: none; margin: 0; padding: 0; border-top: 2px solid var(--ink); }
.gig { display: grid; grid-template-columns: 68px minmax(0, 1fr) auto; gap: 2px 14px; padding: 12px 0; border-bottom: 1px solid var(--line); align-items: start; }
.day { font-family: var(--display); line-height: .9; }
.day b { display: block; font-weight: 900; font-size: 42px; }
.day i { display: block; font: 600 14px/1.2 var(--tight); letter-spacing: .06em; text-transform: uppercase; color: var(--soft); margin-top: 3px; }
.gig.soon .day i { color: var(--spot); }
.what { min-width: 0; }
.what h3 { font: 800 25px/1.08 var(--display); margin: 0; letter-spacing: .005em; overflow-wrap: anywhere; }
.what h3 a { text-decoration: none; }
.what h3 a:hover { color: var(--spot); text-decoration: underline; text-decoration-thickness: 2px; }
.where { margin: 3px 0 0; color: var(--soft); font-size: 15px; }
.where b { color: var(--ink); font-weight: 600; }
.tags { display: flex; flex-wrap: wrap; gap: 4px 8px; margin-top: 6px; align-items: center; }
.g { font: 600 13px/1 var(--tight); letter-spacing: .06em; text-transform: uppercase; }
.g-rock { color: var(--rock); }
.g-metal { color: var(--metal); }
.g-punk { color: var(--punk); }
.g-alt { color: var(--alt); }
.g-hard { color: var(--hard); }
.g-stoner { color: var(--stoner); }
.g-prog { color: var(--prog); }
.g-garage { color: var(--garage); }
.flag { font: 600 12px/1 var(--tight); letter-spacing: .07em; text-transform: uppercase; padding: 3px 5px; }
.flag.new { background: var(--mark); color: var(--mark-ink); }
.flag.sold { background: var(--ink); color: var(--paper); }
.flag.off { background: var(--bad); color: var(--paper); }
.gig.off h3 { text-decoration: line-through; color: var(--soft); }
.go { display: flex; flex-direction: column; align-items: flex-end; gap: 3px; font-size: 13px; color: var(--soft); text-align: right; padding-top: 3px; }
.go a { white-space: nowrap; text-underline-offset: 2px; }
.go a:hover { color: var(--spot); }

.empty { padding: 40px 0; font-size: 18px; color: var(--soft); }
footer { border-top: 2px solid var(--ink); padding-block: 16px 34px; font-size: 14px; color: var(--soft); }
footer p { margin: 0 0 6px; max-width: 72ch; }
footer .down { color: var(--bad); }
footer a { text-underline-offset: 2px; }
footer a:hover { color: var(--spot); }
#hits { font-variant-numeric: tabular-nums; }

@media (max-width: 640px) {
  .gig { grid-template-columns: 56px minmax(0, 1fr); }
  .day b { font-size: 36px; }
  .what h3 { font-size: 23px; }
  .go { grid-column: 2; flex-direction: row; flex-wrap: wrap; justify-content: flex-start; gap: 2px 12px; text-align: left; padding-top: 6px; }
  .bar .wrap { padding-block: 8px; }
  .venue { flex: 1 1 100%; }
  .chip { height: 36px; padding: 0 10px; font-size: 15px; }
  .size { height: 42px; font-size: 21px; }
  .search, .venue { height: 36px; }
  .count { display: none; }
}
@media (prefers-reduced-motion: no-preference) { .next, .chip, .lang { transition: background-color .12s, color .12s; } }
</style>
</head>
<body>
<header class="top wrap">
  <div class="crown">
    <div class="langs" role="group" id="langs" aria-label="Language">
      <button class="lang" type="button" data-l="en" aria-pressed="true">EN</button>
      <button class="lang" type="button" data-l="cs" aria-pressed="false">CZ</button>
      <button class="lang" type="button" data-l="it" aria-pressed="false">IT</button>
    </div>
  </div>
  <h1>Prague<br><span>Rock</span></h1>
  <p class="lede" id="lede"></p>
  <a class="next" id="next" hidden></a>
</header>

<div class="bar">
  <div class="wrap">
    <div class="sizes" role="group" id="sizes">
      <button class="size" id="s-big" data-s="big" type="button" aria-pressed="true"><span id="t-big"></span><small id="n-big"></small></button>
      <button class="size" id="s-niche" data-s="niche" type="button" aria-pressed="false"><span id="t-niche"></span><small id="n-niche"></small></button>
    </div>
    <input class="search" id="q" type="search">
    <div class="chips" role="group" id="chips">
      <button class="chip" data-g="" type="button" aria-pressed="true"></button>
      <button class="chip" data-g="hard" type="button" aria-pressed="false">Hard/Classic</button>
      <button class="chip" data-g="stoner" type="button" aria-pressed="false">Stoner/Psych</button>
      <button class="chip" data-g="prog" type="button" aria-pressed="false">Prog/Post</button>
      <button class="chip" data-g="garage" type="button" aria-pressed="false">Garage/R'n'R</button>
      <button class="chip" data-g="metal" type="button" aria-pressed="false">Metal</button>
      <button class="chip" data-g="punk" type="button" aria-pressed="false">Punk/HC</button>
      <button class="chip" data-g="alt" type="button" aria-pressed="false">Indie/Alt</button>
      <button class="chip" data-g="rock" type="button" aria-pressed="false">Rock</button>
      <button class="chip newonly" id="only-new" type="button" aria-pressed="false"></button>
    </div>
    <select class="venue" id="venue"><option value=""></option></select>
    <p class="count" id="count" aria-live="polite"></p>
  </div>
</div>

<main class="wrap" id="list"><p class="empty" id="loading"></p></main>
<footer class="wrap" id="foot"></footer>

<!--DATA-->
<script>

      months: ["Leden", "Únor", "Březen", "Duben", "Květen", "Červen", "Červenec", "Srpen", "Září", "Říjen", "Listopad", "Prosinec"],
      monthsIn: ["ledna", "února", "března", "dubna", "května", "června", "července", "srpna", "září", "října", "listopadu", "prosince"],
      short: ["led", "úno", "bře", "dub", "kvě", "čvn", "čvc", "srp", "zář", "říj", "lis", "pro"],
      days: ["ne", "po", "út", "st", "čt", "pá", "so"],
      big: "Velké", niche: "Okrajové", all: "Vše", onlyNew: "Jen nové",
      search: "Hledat kapelu nebo klub", allVenues: "Všechny kluby",
      today: "Dnes", tomorrow: "Zítra", ongoing: "Probíhá", tonight: "Dnes večer",
      cancelled: "Zrušeno", soldout: "Vyprodáno", isNew: "Nové",
      until: "do", tba: "Místo bude upřesněno",
      loading: "Načítám koncerty…",
      failed: "Koncerty se nepodařilo načíst. Zkuste stránku za pár minut znovu.",
      noNew: function (d) { return "Za posledních " + d + " dní žádné nové koncerty."; },
      noMatch: "Žádné koncerty s těmito filtry. Zkuste zrušit hledání nebo zvolit Vše.",
      sources: "Zdroje", down: "neodpovídá",
      lastCheck: "Poslední kontrola", atToday: "dnes v", atWord: "v",
      preview: "Toto je náhled: data zůstávají u této kontroly.",
      auto: "Stránka se sama aktualizuje každé 3 hodiny.",
      note: "Velké znamená kapela s nejméně 20 000 fanoušky na Deezeru nebo koncert v aréně (O2 arena, O2 universum, Forum Karlín, Fortuna, Tipsport). Žánry pocházejí ze zdrojů a občas se pletou. Před nákupem si ověřte datum a vstupenky na webu klubu.",
      visits: "Návštěvy", writeTo: "Něco chybí? Napište na",
      count: function (n) { return n + " " + (n === 1 ? "koncert" : (n >= 2 && n <= 4 ? "koncerty" : "koncertů")); },
      lede: function (b, n, m, y) { return "<b>Velká jména: " + b + "</b> · Okrajové: " + n + ". Rock, metal a punk v Praze ode dneška do " + m + " " + y + "."; }
    },
    it: {
      title: "Prague Rock",
      desc: "Tutti i concerti rock, metal e punk a Praga, aggiornati ogni 3 ore.",
      months: ["Gennaio", "Febbraio", "Marzo", "Aprile", "Maggio", "Giugno", "Luglio", "Agosto", "Settembre", "Ottobre", "Novembre", "Dicembre"],
      monthsIn: ["gennaio", "febbraio", "marzo", "aprile", "maggio", "giugno", "luglio", "agosto", "settembre", "ottobre", "novembre", "dicembre"],
      short: ["gen", "feb", "mar", "apr", "mag", "giu", "lug", "ago", "set", "ott", "nov", "dic"],
      days: ["dom", "lun", "mar", "mer", "gio", "ven", "sab"],
      big: "Big", niche: "Nicchia", all: "Tutti", onlyNew: "Solo nuovi",
      search: "Cerca band o locale", allVenues: "Tutti i locali",
      today: "Oggi", tomorrow: "Domani", ongoing: "In corso", tonight: "Stasera",
      cancelled: "Annullato", soldout: "Sold out", isNew: "Nuovo",
      until: "fino al", tba: "Locale da definire",
      loading: "Carico i concerti…",
      failed: "Non riesco a caricare i concerti. Ricarica la pagina tra qualche minuto.",
      noNew: function (d) { return "Nessun concerto nuovo negli ultimi " + d + " giorni."; },
      noMatch: "Nessun concerto con questi filtri. Prova a togliere la ricerca o a scegliere Tutti.",
      sources: "Fonti", down: "non risponde",
      lastCheck: "Ultimo controllo", atToday: "oggi alle", atWord: "alle",
      preview: "Questa è un'anteprima: i dati restano fermi a questo controllo.",
      auto: "La pagina si aggiorna da sola ogni 3 ore.",
      note: "Big vuol dire band con almeno 20.000 fan su Deezer, oppure concerto in un'arena (O2 arena, O2 universum, Forum Karlín, Fortuna, Tipsport). Il genere arriva dalle fonti e a volte sbaglia. Prima di comprare, controlla data e biglietti sul sito del locale.",
      visits: "Visite", writeTo: "Manca qualcosa? Scrivi a",
      count: function (n) { return n + (n === 1 ? " concerto" : " concerti"); },
      lede: function (b, n, m, y) { return "<b>" + b + " grandi nomi</b> e " + n + " concerti di nicchia. Rock, metal e punk a Praga da oggi a " + m + " " + y + "."; }
    }
  };

  var LABEL = { hard: "Hard/Classic", stoner: "Stoner/Psych", prog: "Prog/Post", garage: "Garage/R'n'R", metal: "Metal", punk: "Punk/HC", alt: "Indie/Alt", rock: "Rock" };
  var NEW_DAYS = 7;
  var $ = function (id) { return document.getElementById(id); };
  var state = { q: "", venue: "", onlyNew: false, size: "big", genre: "", lang: "en" };  // genre "" = tutti
  var T = I18N.en;

  function remember() { try { localStorage.setItem("pragarock3", JSON.stringify({ genre: state.genre, venue: state.venue, size: state.size, lang: state.lang })); } catch (e) {} }
  function recall() {
    try {
      var s = JSON.parse(localStorage.getItem("pragarock3") || "null");
      if (s) {
        state.genre = LABEL[s.genre] ? s.genre : "";
        state.venue = s.venue || "";
        state.size = s.size === "niche" ? "niche" : "big";
        if (LANGS.indexOf(s.lang) >= 0) state.lang = s.lang;
        else state.lang = guessLang();
      } else state.lang = guessLang();
    } catch (e) { state.lang = guessLang(); }
    T = I18N[state.lang];
  }
  // Chi non ha mai scelto parte dalla lingua del browser, ceco o italiano se e' una di quelle.
  function guessLang() {
    var l = (navigator.language || "en").slice(0, 2).toLowerCase();
    return LANGS.indexOf(l) >= 0 ? l : "en";
  }
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function fold(s) { return String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase(); }
  function pad(n) { return (n < 10 ? "0" : "") + n; }
  function iso(d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
  function parse(s) { var p = s.split("-"); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function safeUrl(u) { return /^https?:\/\//i.test(u || "") ? u : "#"; }

  var today = iso(new Date());
  var tomorrow = iso(new Date(Date.now() + 864e5));
  var fresh = iso(new Date(Date.now() - NEW_DAYS * 864e5));
  var all = [];
  var status = null;
  var baseline = "9999";

  function isNew(c) { return c.first_seen >= fresh && c.first_seen > baseline; }
  function when(c) {
    if (c.date < today) return T.ongoing;
    if (c.date === today) return T.today;
    if (c.date === tomorrow) return T.tomorrow;
    return T.days[parse(c.date).getDay()];
  }
  function rangeEnd(c) { if (!c.end) return ""; var e = parse(c.end); return " · " + T.until + " " + e.getDate() + " " + T.short[e.getMonth()]; }

  function row(c) {
    var d = parse(c.date < today && c.end ? today : c.date);
    var soon = c.date === today || c.date === tomorrow;
    var flags = "";
    if (c.status === "cancelled") flags += '<span class="flag off">' + T.cancelled + "</span>";
    if (c.status === "soldout") flags += '<span class="flag sold">' + T.soldout + "</span>";
    if (isNew(c)) flags += '<span class="flag new">' + T.isNew + "</span>";
    var genres = c.genres.filter(function (g) { return LABEL[g]; }).map(function (g) { return '<span class="g g-' + g + '">' + LABEL[g] + "</span>"; }).join("");
    var extra = [];
    if (c.time) extra.push(c.time);
    if (c.price) extra.push(esc(c.price));
    var links = c.links.map(function (l) {
      return '<a href="' + esc(safeUrl(l.url)) + '" target="_blank" rel="noopener">' + esc(l.name) + "</a>";
    }).join("");
    return '<li class="gig' + (soon ? " soon" : "") + (c.status === "cancelled" ? " off" : "") + '">' +
      '<div class="day"><b>' + pad(d.getDate()) + "</b><i>" + when(c) + "</i></div>" +
      '<div class="what"><h3><a href="' + esc(safeUrl((c.links[0] || {}).url)) + '" target="_blank" rel="noopener">' + esc(c.title) + "</a></h3>" +
      '<p class="where"><b>' + esc(c.venue || T.tba) + "</b>" + (extra.length ? " · " + extra.join(" · ") : "") + rangeEnd(c) + "</p>" +
      '<div class="tags">' + flags + genres + "</div></div>" +
      '<div class="go">' + links + "</div></li>";
  }

  function matches(c) {
    if (!!c.big !== (state.size === "big")) return false;
    if (state.genre && c.genres.indexOf(state.genre) < 0) return false;
    if (state.venue && c.venue !== state.venue) return false;
    if (state.onlyNew && !isNew(c)) return false;
    if (state.q && (fold(c.title) + " " + fold(c.venue)).indexOf(fold(state.q)) < 0) return false;
    return true;
  }

  function render() {
    var shown = all.filter(matches);
    var out = "", month = "", open = false, i;
    var perMonth = {};
    shown.forEach(function (c) { var k = (c.date < today ? today : c.date).slice(0, 7); perMonth[k] = (perMonth[k] || 0) + 1; });
    for (i = 0; i < shown.length; i++) {
      var c = shown[i], k = (c.date < today ? today : c.date).slice(0, 7);
      if (k !== month) {
        if (open) out += "</ol>";
        var p = k.split("-");
        out += '<div class="month"><h2>' + T.months[+p[1] - 1] + " " + p[0] + "</h2><span>" + T.count(perMonth[k]) + '</span></div><ol class="gigs">';
        month = k; open = true;
      }
      out += row(c);
    }
    if (open) out += "</ol>";
    $("list").innerHTML = out || '<p class="empty">' + (state.onlyNew ? T.noNew(NEW_DAYS) : T.noMatch) + "</p>";
    $("count").textContent = T.count(shown.length);
  }

  function ago(isoStamp) {
    var d = new Date(isoStamp);
    if (isNaN(d)) return "";
    var same = iso(d) === today;
    var hhmm = pad(d.getHours()) + ":" + pad(d.getMinutes());
    return same ? T.atToday + " " + hhmm : d.getDate() + " " + T.short[d.getMonth()] + " " + T.atWord + " " + hhmm;
  }

  function paintHeader() {
    var big = all.filter(function (c) { return c.big; });
    $("n-big").textContent = big.length;
    $("n-niche").textContent = all.length - big.length;
    if (all.length) {
      var e = parse(all[all.length - 1].date);
      $("lede").innerHTML = T.lede(big.length, all.length - big.length, T.monthsIn[e.getMonth()], e.getFullYear());
    } else {
      $("lede").textContent = T.desc;
    }
    var upcoming = big.filter(function (c) { return c.status !== "cancelled" && c.date >= today; })[0];
    var n = $("next");
    if (upcoming) {
      n.hidden = false;
      n.href = safeUrl((upcoming.links[0] || {}).url);
      n.target = "_blank"; n.rel = "noopener";
      var d = parse(upcoming.date);
      var label = upcoming.date === today ? T.tonight : upcoming.date === tomorrow ? T.tomorrow : T.days[d.getDay()] + " " + d.getDate() + " " + T.short[d.getMonth()];
      n.innerHTML = "<small>" + label + "</small><strong>" + esc(upcoming.title) + "</strong><em>" + esc(upcoming.venue) + (upcoming.time ? " · " + upcoming.time : "") + "</em>";
    } else { n.hidden = true; }
  }

  function paintFoot() {
    var foot = "";
    if (status && status.sources) {
      foot += "<p>" + T.sources + ": " + status.sources.map(function (s) {
        return s.ok ? esc(s.name) + " " + s.count : '<span class="down">' + esc(s.name) + " " + T.down + "</span>";
      }).join(" · ") + ".</p>";
    }
    if (status && status.updated) foot += "<p>" + T.lastCheck + ": " + ago(status.updated) + ". " + (status.preview ? T.preview : T.auto) + "</p>";
    foot += "<p>" + T.note + "</p>";
    if (CONTACT) foot += '<p>' + T.writeTo + ' <a href="mailto:' + esc(CONTACT) + '">' + esc(CONTACT) + "</a>.</p>";
    if (GOATCOUNTER) foot += "<p>" + T.visits + ": <span id=\"hits\"></span></p>";
    $("foot").innerHTML = foot;
    if (GOATCOUNTER && window.goatcounter && window.goatcounter.visit_count) {
      try { window.goatcounter.visit_count({ append: "#hits", type: "html", no_branding: true }); } catch (e) {}
    }
  }

  // Tutto il testo fisso passa di qui: un giro solo a ogni cambio di lingua.
  function applyLang() {
    T = I18N[state.lang];
    document.documentElement.lang = state.lang;
    document.title = T.title;
    var md = $("meta-desc"); if (md) md.setAttribute("content", T.desc);
    $("t-big").textContent = T.big;
    $("t-niche").textContent = T.niche;
    $("q").placeholder = T.search;
    $("q").setAttribute("aria-label", T.search);
    $("only-new").textContent = T.onlyNew;
    document.querySelector('.chip[data-g=""]').textContent = T.all;
    $("venue").options[0].textContent = T.allVenues;
    $("venue").setAttribute("aria-label", T.allVenues);
    $("sizes").setAttribute("aria-label", T.big + " / " + T.niche);
    var load = $("loading"); if (load) load.textContent = T.loading;
    document.querySelectorAll(".lang").forEach(function (b) {
      b.setAttribute("aria-pressed", b.getAttribute("data-l") === state.lang ? "true" : "false");
    });
    if (all.length) { paintHeader(); paintFoot(); render(); }
  }

  function start(concerts, st) {
    all = concerts.filter(function (c) { return (c.end || c.date) >= today && c.genres && c.genres.length; });
    status = st;
    baseline = (st && st.baseline) || today;  // quello che c'era al primo giro non e' "nuovo"

    var venues = {};
    all.forEach(function (c) { if (c.venue) venues[c.venue] = (venues[c.venue] || 0) + 1; });
    Object.keys(venues).sort(function (a, b) { return venues[b] - venues[a] || a.localeCompare(b); }).forEach(function (v) {
      var o = document.createElement("option");
      o.value = v; o.textContent = v + " (" + venues[v] + ")";
      $("venue").appendChild(o);
    });
    if (state.venue && !venues[state.venue]) state.venue = "";
    $("venue").value = state.venue;

    paintHeader();
    paintFoot();
    render();
  }

  recall();
  applyLang();

  var chips = document.querySelectorAll(".chip[data-g]");
  function paintChips() { chips.forEach(function (b) { b.setAttribute("aria-pressed", b.getAttribute("data-g") === state.genre ? "true" : "false"); }); }
  paintChips();
  document.querySelectorAll(".size").forEach(function (b) {
    b.setAttribute("aria-pressed", b.getAttribute("data-s") === state.size ? "true" : "false");
    b.addEventListener("click", function () {
      state.size = b.getAttribute("data-s");
      document.querySelectorAll(".size").forEach(function (x) { x.setAttribute("aria-pressed", x === b ? "true" : "false"); });
      remember(); render();
    });
  });
  chips.forEach(function (b) {
    b.addEventListener("click", function () {
      var g = b.getAttribute("data-g");
      state.genre = g === state.genre ? "" : g;  // ripremere lo stesso genere torna a tutti
      paintChips(); remember(); render();
    });
  });
  document.querySelectorAll(".lang").forEach(function (b) {
    b.addEventListener("click", function () {
      state.lang = b.getAttribute("data-l");
      applyLang(); remember();
    });
  });
  $("only-new").addEventListener("click", function () {
    state.onlyNew = !state.onlyNew;
    this.setAttribute("aria-pressed", state.onlyNew ? "true" : "false");
    render();
  });
  $("q").addEventListener("input", function () { state.q = this.value.trim(); render(); });
  $("venue").addEventListener("change", function () { state.venue = this.value; remember(); render(); });

  if (GOATCOUNTER) {
    var gc = document.createElement("script");
    gc.async = true;
    gc.src = "//gc.zgo.at/count.js";
    gc.setAttribute("data-goatcounter", GOATCOUNTER);
    gc.addEventListener("load", paintFoot);
    document.body.appendChild(gc);
  }

  if (window.__DATA__) { start(window.__DATA__.concerts, window.__DATA__.status); return; }
  Promise.all([
    fetch("concerts.json", { cache: "no-cache" }).then(function (r) { if (!r.ok) throw 0; return r.json(); }),
    fetch("status.json", { cache: "no-cache" }).then(function (r) { return r.ok ? r.json() : null; }).catch(function () { return null; })
  ]).then(function (r) { start(r[0], r[1]); }).catch(function () {
    $("list").innerHTML = '<p class="empty">' + T.failed + "</p>";
  });
})();
</script>
</body>
</html>
